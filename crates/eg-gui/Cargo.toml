[package]
name = "eg-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A local web UI over an ExcelGRAG corpus, with a shared agent/human chat session over MCP."

[dependencies]
# Not workspace-aliased, matching eg-cli's existing convention for this
# downstream, non-pipeline crate.
eg-mcp = { path = "../eg-mcp" }

eg-graph.workspace = true
eg-index.workspace = true
eg-retrieve.workspace = true
eg-ingest.workspace = true
eg-structure.workspace = true
eg-model.workspace = true

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
futures.workspace = true
notify.workspace = true
petgraph.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
webbrowser.workspace = true

# MCP bridge and chat: maintained crates, not hand-rolled, matching the
# rationale in docs/design.md.
rmcp.workspace = true
async-openai.workspace = true

[dev-dependencies]
tempfile = "3"
