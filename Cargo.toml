[workspace]
resolver = "2"
members = [
    "crates/eg-model",
    "crates/eg-ingest",
    "crates/eg-structure",
    "crates/eg-graph",
    "crates/eg-index",
    "crates/eg-retrieve",
    "crates/eg-eval",
    "crates/eg-mcp",
    "crates/eg-cli",
    "crates/eg-gui",
    "crates/eg-agent",
    "crates/eg-fixtures",
]
exclude = ["vendor/calamine"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sjvrensburg/ExcelGRAG"
rust-version = "1.95"

[workspace.dependencies]
eg-model = { path = "crates/eg-model" }
eg-ingest = { path = "crates/eg-ingest" }
eg-structure = { path = "crates/eg-structure" }
eg-graph = { path = "crates/eg-graph" }
eg-index = { path = "crates/eg-index" }
eg-retrieve = { path = "crates/eg-retrieve" }
eg-eval = { path = "crates/eg-eval" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustc-hash = "2"
petgraph = { version = "0.8", features = ["serde-1"] }
smallvec = { version = "1", features = ["serde"] }
fs4 = "0.13"
tantivy = "0.26"
fastembed = { version = "6", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
] }

# eg-gui: web GUI + shared agent/human chat over MCP.
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
notify = "8"
rust-embed = "8"
webbrowser = "1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
# Official Rust MCP SDK — the GUI's MCP bridge runs on the Tokio runtime
# eg-gui already needs for Axum, so it uses this instead of hand-rolling a
# second JSON-RPC loop next to eg-mcp's existing sync one.
rmcp = { version = "3", features = ["transport-io", "server"] }
# OpenAI-chat-completions-compatible client for the optional chat LLM (local
# llama.cpp/ollama or a hosted API — anything speaking the same wire format).
# `rustls` matches this workspace's existing rustls-only TLS convention
# (fastembed is built the same way).
async-openai = { version = "0.42", default-features = false, features = [
    "chat-completion",
    "rustls",
] }
# The agent harness's model loop: rig-agent is the sans-IO `AgentRun` state
# machine eg-agent drives by hand, rig-core the provider clients and message
# types under it. The two crates directly, never the `rig` facade: the facade
# lists `rig-fastembed` as an optional dependency, and Cargo resolves optional
# dependencies whether or not their feature is on, so the facade pins
# fastembed 4 / ort rc.9 against eg-index's fastembed 6 / ort rc.13 and the
# workspace stops resolving at all. No default features, because the default
# is `derive`, which nothing here uses.
rig-agent = { version = "0.42", default-features = false }
# The bundled model runtime: fetched, verified and unpacked by eg-gui's
# sidecar (`sidecar.rs`). reqwest 0.13 because rig-core is already on it;
# async-openai pins 0.12 alongside, and a third copy would be one too many.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
rig-core = { version = "0.42", default-features = false, features = ["reqwest", "rustls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Vendored calamine source carrying the reader fixes listed below, plus
# defined-name scope preservation, ODS error cells, and correct XLS XTI lookup.
#
#   tafia/calamine#712 (branch xlsb-shared-formulas) — XLSB/XLS shared and array
#     formulas, and the transposed `>`/`>=` operators. Without it 70% of the
#     formulas in a real XLSB workbook are silently lost.
#   tafia/calamine#713 (branch quote-sheet-names) — a sheet name needing quotes
#     is written bare, so `'Q3 SALES'!A1` reads as a sheet called `SALES`.
#   branch xlsb-relative-columns, not yet submitted — a reference's relativity
#     flags are read as part of its column, and the two flags are the wrong way
#     round. Together they misread the references of most filled formulas.
#   branch xlsb-formula-error-cells, not yet submitted — a formula cell whose
#     cached value is an error is skipped, so the cell is absent rather than
#     merely valueless.
#   branch xlsb-external-supbooks, not yet submitted — a reference into another
#     workbook is resolved against this one's sheets, naming a real sheet and
#     recording a real dependency on the wrong one.
#
# The patched revision is vendored so every correctness fix used by ExcelGRAG
# is reproducible from this repository. Drop this section once they all land in
# a published release.
[patch.crates-io]
calamine = { path = "vendor/calamine" }
