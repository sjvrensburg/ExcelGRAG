[workspace]
resolver = "2"
members = [
    "crates/eg-model",
    "crates/eg-ingest",
    "crates/eg-structure",
    "crates/eg-graph",
    "crates/eg-index",
    "crates/eg-retrieve",
    "crates/eg-eval",
    "crates/eg-mcp",
    "crates/eg-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sjvrensburg/ExcelGRAG"
rust-version = "1.85"

[workspace.dependencies]
eg-model = { path = "crates/eg-model" }
eg-ingest = { path = "crates/eg-ingest" }
eg-structure = { path = "crates/eg-structure" }
eg-graph = { path = "crates/eg-graph" }
eg-index = { path = "crates/eg-index" }
eg-retrieve = { path = "crates/eg-retrieve" }
eg-eval = { path = "crates/eg-eval" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustc-hash = "2"
petgraph = { version = "0.8", features = ["serde-1"] }
smallvec = { version = "1", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# calamine fork carrying three fixes, each submitted upstream on its own branch
# and pointed at here through one integration branch, since `[patch.crates-io]`
# takes a single source:
#
#   tafia/calamine#712 (branch xlsb-shared-formulas) — XLSB/XLS shared and array
#     formulas, and the transposed `>`/`>=` operators. Without it 70% of the
#     formulas in a real XLSB workbook are silently lost.
#   tafia/calamine#713 (branch quote-sheet-names) — a sheet name needing quotes
#     is written bare, so `'Q3 SALES'!A1` reads as a sheet called `SALES`.
#
# Drop this section once both land in a published release.
[patch.crates-io]
calamine = { git = "https://github.com/sjvrensburg/calamine.git", branch = "excelgrag" }
